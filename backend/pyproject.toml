[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "plecoach-backend"
version = "0.1.0"
description = "Backend lesson planning and LiveKit voice tutor for Plecoach"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "livekit-agents>=1.6.1,<2",
  "livekit-api>=1.0,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "redis[hiredis]>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["plecoach"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
